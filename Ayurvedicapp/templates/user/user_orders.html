{% extends 'user/user_home.html' %}
{% block content %}
<div class="container-fluid bg-primary hero-header mb-5">
    <div class="container text-center">
        <h1 class="display-4 text-white mb-3 animated slideInDown">My Orders</h1>
    </div>
</div>

<div class="col-lg-12">
    <div class="row">
        {% for x in data %}

        <div class="col-lg-6 mb-3">
            <table>
                <tr>
                    <td><img src="{{x.product_id.img.url}}" alt=" " width="200" height="200"> </td>
                    <td> <center>
                        Quantity:{{x.cart_id.qnty}}<br>
                        Price:{{x.product_id.amnt}}/-<br>
                        Total Amount:{{x.total}}/-<br><br><br>
                     
                          <td><a href="/user_add_feedback/?id={{x.product_id.id}}" class="btn btn-primary w-55 py-6">FeedBack</a></td>
                    
                       </td>
                </tr>
            </table> 
        </div>
        {% empty %}
        &nbsp;&nbsp;&nbsp;&nbsp;<h6>NO Orders found...</h6>
        {% endfor %}

    </div>
 </div>   

<div class="container-fluid newsletter bg-primary py-5 my-5">
    <div class="container py-5">
        <div class="mx-auto text-center wow fadeIn" data-wow-delay="0.1s" style="max-width: 600px;">
            <h1 class="text-white mb-3"><span class="fw-light text-dark"></h1>
            <p class="text-white mb-4"></p>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-7 wow fadeIn" data-wow-delay="0.5s">
               
            </div>
        </div>
    </div>
</div>

{% endblock %}
